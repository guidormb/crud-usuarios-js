<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRUD Usuarios</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4f46e5" />
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
<link rel="stylesheet" href="style.css" />
</head>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
  }
</script>
<body>
<header class="topbar">
<h1>CRUD Usuarios</h1>
<button id="btnTema" aria-label="Cambiar tema">🌙</button>
</header>

<main class="container">
<input id="inputBuscar" type="search" placeholder="Buscar por nombre o email..." autocomplete="off" />
<select id="selectOrden">
<option value="id">Por ID</option>
<option value="nombre">Nombre A-Z</option>
<option value="nombre_desc">Nombre Z-A</option>
<option value="edad">Edad menor</option>
<option value="edad_desc">Edad mayor</option>
</select>

<p id="contador" class="contador"></p>

<form id="formUsuario" class="form">
<input id="nombre" placeholder="Nombre" required />
<input id="edad" type="number" placeholder="Edad" min="1" max="120" required />
<input id="email" type="email" placeholder="Email" required />
<button id="btnAgregar" type="submit">Agregar</button>
</form>

<div class="actions">
<button id="btnExportar">Exportar JSON</button>
<label for="inputImportar" class="import-label">Importar JSON</label>
<input id="inputImportar" type="file" accept=".json" hidden />
</div>

<ul id="lista" class="lista"></ul>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
